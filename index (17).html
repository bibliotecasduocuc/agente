<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bibliotecas Duoc UC · Consulta 24/7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --duoc-yellow:#FFC72C;
    --duoc-yellow-deep:#F5A800;
    --duoc-yellow-soft:#FFF4D6;
    --ink:#111318;
    --ink-2:#1B1F27;
    --ink-soft:#3A3F49;
    --paper:#FFFFFF;
    --surface:#F4F5F7;
    --surface-2:#ECEEF2;
    --line:#E3E5E9;
    --link:#0A5BD3;
    --radius:16px;
    --radius-lg:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -200px, rgba(245,168,0,.08), transparent 70%),
      var(--surface);
    color:var(--ink);
    display:flex;
    justify-content:center;
    align-items:stretch;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    width:100%;
    max-width:760px;
    height:100vh;
    max-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
    border:1px solid var(--line);
    overflow:hidden;
  }
  @media(min-width:800px){
    body{padding:16px}
    .app{height:calc(100vh - 32px);box-shadow:0 8px 30px rgba(21,24,30,.08)}
  }
  header{
    position:relative;
    background:
      radial-gradient(600px 200px at 0% 0%, rgba(245,168,0,.15), transparent 60%),
      linear-gradient(180deg, var(--ink-2), var(--ink));
    color:#fff;
    padding:11px 18px;
    display:flex;
    align-items:center;
    gap:13px;
    flex-shrink:0;
    border-bottom:3px solid var(--duoc-yellow);
  }
  .logo-mark{
    position:relative;
    width:44px;height:44px;border-radius:13px;
    background:linear-gradient(135deg, var(--duoc-yellow), var(--duoc-yellow-deep));
    display:flex;align-items:center;justify-content:center;
    font-family:'Archivo';font-weight:900;font-size:20px;color:var(--ink);
    flex-shrink:0;
    box-shadow:0 4px 14px rgba(245,168,0,.35);
  }
  .header-text{flex:1;min-width:0}
  .header-text h1{
    font-family:'Archivo',sans-serif;
    font-size:16.5px;font-weight:800;letter-spacing:-.015em;
    line-height:1.15;
  }
  .header-text .accent{color:var(--duoc-yellow)}
  @media(max-width:480px){
    .header-text h1{font-size:19px}
    .header-text .status{font-size:13.5px}
    .logo-mark{width:42px;height:42px;font-size:18px}
    /* Agrandar para mejor legibilidad en celular y dentro del iframe */
    .bubble{font-size:18px;line-height:1.62;padding:15px 17px;max-width:90%}
    .avatar{width:38px;height:38px;font-size:15px}
    .chip{font-size:16px;padding:12px 16px}
    .chip svg{width:19px;height:19px}
    .chips-label{font-size:12.5px}
    #input{font-size:18px}
    .footer-note{font-size:12.5px}
    .msg{gap:9px}
  }
  .status{
    display:flex;align-items:center;gap:7px;
    font-size:13px;color:#D4D8DF;margin-top:0;font-weight:600;
  }
  .status .dot{
    width:7px;height:7px;border-radius:50%;
    background:#3DD68C;box-shadow:0 0 0 0 rgba(61,214,140,.6);
    animation:pulse 2.4s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(61,214,140,.5)}
    70%{box-shadow:0 0 0 6px rgba(61,214,140,0)}
    100%{box-shadow:0 0 0 0 rgba(61,214,140,0)}
  }
  @media(prefers-reduced-motion:reduce){.status .dot{animation:none}}
  .chat{
    flex:1;
    overflow-y:auto;
    padding:20px 18px 8px;
    scroll-behavior:smooth;
  }
  .msg{
    display:flex;gap:10px;margin-bottom:16px;
    animation:rise .25s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.msg{animation:none}}
  .avatar{
    width:32px;height:32px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;font-family:'Archivo';
  }
  .msg.bot .avatar{
    background:linear-gradient(135deg, var(--duoc-yellow), var(--duoc-yellow-deep));
    color:var(--ink);box-shadow:0 2px 8px rgba(245,168,0,.28);
  }
  .msg.user{flex-direction:row-reverse}
  .msg.user .avatar{background:var(--ink);color:#fff}
  .bubble{
    max-width:84%;
    padding:12px 15px;
    border-radius:14px;
    font-size:14.5px;line-height:1.58;
    overflow-wrap:break-word;
  }
  .msg.bot .bubble{background:var(--paper);border:1px solid var(--line);border-top-left-radius:5px;box-shadow:0 1px 2px rgba(21,24,30,.04)}
  .msg.user .bubble{background:linear-gradient(180deg, var(--ink-2), var(--ink));color:#fff;border-top-right-radius:5px}
  .bubble p{margin:0 0 8px}
  .bubble p:last-child{margin:0}
  .bubble ul,.bubble ol{margin:4px 0 8px 18px}
  .bubble li{margin-bottom:4px}
  .bubble a{color:var(--link);font-weight:500;text-decoration:underline;text-underline-offset:2px;word-break:break-word}
  .msg.user .bubble a{color:var(--duoc-yellow)}
  .bubble strong{font-weight:600}
  .bubble code{background:#E9EBEF;padding:1px 5px;border-radius:4px;font-size:13px}
  .typing{display:inline-flex;align-items:center;gap:8px;padding:2px 0;font-size:13px;color:var(--ink-soft)}
  .typing .dots{display:inline-flex;gap:4px}
  .typing .dots span{width:7px;height:7px;border-radius:50%;background:#A8ADB7;animation:blink 1.2s infinite}
  .typing .dots span:nth-child(2){animation-delay:.2s}
  .typing .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
  .chips-label{
    padding:2px 20px 8px;flex-shrink:0;
    font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:#9AA0AB;font-family:'Archivo';
  }
  .chips{
    display:flex;flex-wrap:wrap;gap:8px;
    padding:0 18px 14px;flex-shrink:0;
  }
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--paper);
    border:1.5px solid var(--line);
    color:var(--ink);
    font-size:13px;font-weight:600;font-family:'Inter';
    padding:9px 14px 9px 11px;border-radius:12px;
    cursor:pointer;
    transition:border-color .18s,background .18s,transform .12s,box-shadow .18s;
  }
  .chip svg{width:16px;height:16px;flex-shrink:0;color:var(--duoc-yellow-deep);transition:transform .18s}
  .chip:hover{
    background:var(--duoc-yellow-soft);
    border-color:var(--duoc-yellow-deep);
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(245,168,0,.18);
  }
  .chip:hover svg{transform:scale(1.12) rotate(-4deg)}
  .chip:active{transform:translateY(0)}
  .chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .input-bar{
    display:flex;gap:8px;align-items:flex-end;
    padding:12px 16px;
    border-top:1px solid var(--line);
    background:var(--paper);flex-shrink:0;
  }
  .new-chat{
    width:44px;height:44px;border-radius:12px;flex-shrink:0;
    background:var(--surface);
    color:var(--ink-soft);
    border:1.5px solid var(--line);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,color .15s,border-color .15s,transform .1s;
  }
  .new-chat:hover{background:var(--duoc-yellow-soft);color:var(--ink);border-color:#F2DA9A}
  .new-chat:active{transform:scale(.95)}
  .new-chat:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .new-chat svg{width:19px;height:19px}
  textarea{
    flex:1;resize:none;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:11px 14px;
    font-family:'Inter';font-size:14.5px;line-height:1.4;
    max-height:120px;
    outline:none;transition:border-color .15s;
    background:var(--surface);
  }
  textarea:focus{border-color:var(--ink)}
  .send{
    width:44px;height:44px;border-radius:12px;border:none;
    background:var(--duoc-yellow);color:var(--ink);
    cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,transform .1s;
  }
  .send:hover{background:#FFD354}
  .send:active{transform:scale(.95)}
  .send:disabled{background:var(--line);cursor:not-allowed}
  .send svg{width:20px;height:20px}
  .send:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .footer-note{
    text-align:center;font-size:10.5px;color:#9AA0AB;
    padding:0 16px 10px;flex-shrink:0;
  }
  .footer-note a{color:#6B7280}
  /* Botón de leer en voz alta (accesibilidad) */
  .speak-btn{
    display:inline-flex;align-items:center;gap:5px;
    margin-top:8px;
    background:var(--surface);border:1px solid var(--line);
    color:var(--ink-soft);
    font-family:'Inter';font-size:12px;font-weight:600;
    padding:5px 10px;border-radius:9px;cursor:pointer;
    transition:background .15s,border-color .15s,color .15s;
  }
  .speak-btn svg{width:14px;height:14px}
  .speak-btn:hover{background:var(--duoc-yellow-soft);border-color:var(--duoc-yellow-deep);color:var(--ink)}
  .speak-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .speak-btn.reproduciendo{background:var(--duoc-yellow-soft);border-color:var(--duoc-yellow-deep);color:var(--ink)}
  @media(max-width:480px){ .speak-btn{font-size:13px;padding:6px 12px} .speak-btn svg{width:16px;height:16px} }
</style>
</head>
<body>
<div class="app" role="application" aria-label="Bibliotecas Duoc UC - Consulta 24/7">

  <header>
    <div class="header-text">
      <div class="status"><span class="dot"></span> En línea · te ayudo al instante</div>
    </div>
  </header>

  <div class="chat" id="chat" aria-live="polite"></div>

  <div class="chips-label" id="chipsLabel" style="display:none"></div>
  <div class="chips" id="chips" style="display:none"></div>

  <div class="input-bar">
    <button class="new-chat" id="newChat" aria-label="Empezar una nueva conversación" title="Nueva conversación">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-6.36 2.64L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="Escribe tu consulta…" aria-label="Escribe tu consulta"></textarea>
    <button class="send" id="send" aria-label="Enviar mensaje">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>

  <div class="footer-note">
    ¿Prefieres ayuda humana? <a href="https://bibliotecas.duoc.cl/consultanos" target="_blank" rel="noopener">Atención virtual</a>
  </div>
</div>

<script>
const API_URL = "https://chatbot-qy6a.onrender.com/api/chat";

const chatEl   = document.getElementById('chat');
const inputEl  = document.getElementById('input');
const sendBtn  = document.getElementById('send');
const chipsEl  = document.getElementById('chips');
let history = [];
let busy = false;
// ID único de esta conversación (para agrupar métricas). Se genera al cargar
// y se renueva al iniciar una conversación nueva.
function nuevoConvId(){
  return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}
let convId = nuevoConvId();

function md(text){
  let h = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[^"'=\]>])(https?:\/\/[^\s<)\]"']+)/g, function(_, antes, url){
      // red de seguridad: URLs sueltas (texto plano) tambien se vuelven clicables
      var limpia = url.replace(/[.,;:!?]+$/, '');
      var cola = url.slice(limpia.length);
      return antes + '<a href="' + limpia + '" target="_blank" rel="noopener">' + limpia + '</a>' + cola;
    })
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
  const lines = h.split('\n');
  let out = [], inUl = false, inOl = false;
  for (const line of lines){
    const hd = line.match(/^\s*#{1,6}\s+(.*)/);
    if (hd){
      if(inUl){out.push('</ul>');inUl=false}
      if(inOl){out.push('</ol>');inOl=false}
      out.push('<p style="margin-top:6px"><strong>'+hd[1].replace(/[:*]+$/,'')+'</strong></p>');
      continue;
    }
    const ul = line.match(/^\s*[-•]\s+(.*)/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    if (ul){ if(inOl){out.push('</ol>');inOl=false} if(!inUl){out.push('<ul>');inUl=true} out.push('<li>'+ul[1]+'</li>'); }
    else if (ol){ if(inUl){out.push('</ul>');inUl=false} if(!inOl){out.push('<ol>');inOl=true} out.push('<li>'+ol[1]+'</li>'); }
    else {
      if(inUl){out.push('</ul>');inUl=false}
      if(inOl){out.push('</ol>');inOl=false}
      if(line.trim()) out.push('<p>'+line+'</p>');
    }
  }
  if(inUl) out.push('</ul>');
  if(inOl) out.push('</ol>');
  return out.join('');
}

function addMsg(role, html){
  const div = document.createElement('div');
  div.className = 'msg ' + (role==='user' ? 'user' : 'bot');
  div.innerHTML = `<div class="avatar">${role==='user'?'Tú':'B'}</div><div class="bubble">${html}</div>`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}
function addTyping(){
  return addMsg('bot',
    '<div class="typing"><span class="dots"><span></span><span></span><span></span></span><span class="typing-label">Dame un momento…</span></div>');
}

function updatePlaceholder(userText, botText){
  // Placeholder siempre fijo (las sugerencias dinámicas no eran precisas).
  inputEl.placeholder = 'Escribe tu consulta…';
}

// --- Lectura en voz alta (accesibilidad, voz del navegador) ---
let _vozActual = null;
function elegirVozES(){
  const voces = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  // preferir español de Chile, luego cualquier español
  return voces.find(v=>/es-CL/i.test(v.lang))
      || voces.find(v=>/es-419|es-MX|es-US/i.test(v.lang))
      || voces.find(v=>/^es/i.test(v.lang))
      || null;
}
function textoPlano(html){
  const t = document.createElement('div');
  t.innerHTML = html;
  return (t.textContent || t.innerText || '').replace(/\s+/g,' ').trim();
}
function leerEnVoz(texto, btn){
  if(!('speechSynthesis' in window)){ return; }
  // si ya está leyendo esta misma, detener (toggle)
  if(btn.classList.contains('reproduciendo')){
    speechSynthesis.cancel();
    return;
  }
  speechSynthesis.cancel(); // detener cualquier otra lectura
  document.querySelectorAll('.speak-btn.reproduciendo').forEach(b=>b.classList.remove('reproduciendo'));
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = 'es-CL';
  const voz = elegirVozES();
  if(voz) u.voice = voz;
  u.rate = 1.0; u.pitch = 1.0;
  u.onend = ()=>btn.classList.remove('reproduciendo');
  u.onerror = ()=>btn.classList.remove('reproduciendo');
  btn.classList.add('reproduciendo');
  speechSynthesis.speak(u);
}
// precargar voces (algunos navegadores las cargan async)
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = elegirVozES; }

function agregarBotonVoz(bubbleEl){
  if(!('speechSynthesis' in window)) return; // navegador sin soporte: no mostrar botón
  const texto = textoPlano(bubbleEl.innerHTML);
  if(!texto) return;
  const btn = document.createElement('button');
  btn.className = 'speak-btn';
  btn.type = 'button';
  btn.setAttribute('aria-label','Escuchar esta respuesta');
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg> Escuchar';
  btn.addEventListener('click', ()=>leerEnVoz(texto, btn));
  bubbleEl.appendChild(btn);
}

async function askClaude(userText){
  history.push({role:'user', content:userText});
  const typingEl = addTyping();
  const bubble = typingEl.querySelector('.bubble');
  busy = true; sendBtn.disabled = true;

  let acc = '';
  let rafPending = false;
  const renderNow = ()=>{
    rafPending = false;
    bubble.innerHTML = md(acc);
    chatEl.scrollTop = chatEl.scrollHeight;
  };
  const scheduleRender = ()=>{ if(!rafPending){ rafPending = true; requestAnimationFrame(renderNow); } };

  try{
    const response = await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ messages: history, conversation_id: convId })
    });

    if(!response.ok || !response.body) throw new Error('HTTP '+response.status);

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, {stream:true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for(const line of lines){
        const s = line.trim();
        if(!s.startsWith('data:')) continue;
        const payload = s.slice(5).trim();
        if(payload === '[DONE]') continue;
        let evt;
        try{ evt = JSON.parse(payload); }catch{ continue; }
        if(evt.type === 'content_block_delta' && evt.delta){
          if(evt.delta.type === 'text_delta' && evt.delta.text){
            if(!acc) bubble.classList.remove('is-typing');
            acc += evt.delta.text;
            scheduleRender();
          }
        }
        if(evt.type === 'content_block_start' && evt.content_block && evt.content_block.type === 'server_tool_use'){
          if(!acc){ bubble.innerHTML = '<div class="typing"><span class="dots"><span></span><span></span><span></span></span><span>Buscando en los recursos…</span></div>'; }
        }
      }
    }

    const reply = acc.trim() || 'Lo siento, tuve un problema al responder. ¿Puedes intentarlo de nuevo?';
    history.push({role:'assistant', content:reply});
    bubble.innerHTML = md(reply);
    agregarBotonVoz(bubble);
    updatePlaceholder(userText, reply);
  }catch(err){
    console.error(err);
    bubble.innerHTML =
      '<p>Hubo un problema de conexión. Intenta nuevamente, o contacta al staff de la biblioteca por <a href="https://bibliotecas.duoc.cl/consultanos" target="_blank" rel="noopener">Consúltanos</a>.</p>';
  }finally{
    busy = false; sendBtn.disabled = false;
    chatEl.scrollTop = chatEl.scrollHeight;
    inputEl.focus();
  }
}

function send(){
  const text = inputEl.value.trim();
  if(!text || busy) return;
  addMsg('user', md(text));
  inputEl.value = '';
  inputEl.style.height = 'auto';
  chipsEl.style.display = 'none';
  document.getElementById('chipsLabel').style.display = 'none';
  askClaude(text);
}
sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
inputEl.addEventListener('input', ()=>{
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight,120)+'px';
});
chipsEl.addEventListener('click', e=>{
  const chip = e.target.closest('.chip');
  if(chip){
    inputEl.value = chip.dataset.q || chip.textContent.trim();
    send();
  }
});

const WELCOME = `👋 Hola. Puedo ayudarte con dudas cotidianas de tu biblioteca (préstamos, salas, horarios), temas académicos (citar en APA, estructurar tu informe) y a buscar información y material para tus trabajos. 🚀`;

function nuevaConversacion(){
  if(busy) return;
  history = [];
  convId = nuevoConvId();
  chatEl.innerHTML = '';
  inputEl.value = '';
  inputEl.style.height = 'auto';
  inputEl.placeholder = 'Escribe tu consulta…';
  addMsg('bot', md(WELCOME));
  inputEl.focus();
}
document.getElementById('newChat').addEventListener('click', nuevaConversacion);

addMsg('bot', md(WELCOME));
inputEl.focus();
</script>
</body>
</html>
